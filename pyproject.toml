[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-regime-bot"
version = "0.1.0"
description = "A FRED and yfinance powered US macro regime classifier"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fredapi>=0.5.2",
    "numpy>=1.22",
    "pandas>=2.0",
    "plotly>=5.20",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "streamlit>=1.40",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
macro-regime = "macro_regime_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
